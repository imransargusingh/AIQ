[package]
name = "aiq-spike-win"
version = "0.1.0"
edition = "2024"

[dependencies]
interprocess = "2.4"
uuid = { version = "1.29", features = ["v7"] }
widestring = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
