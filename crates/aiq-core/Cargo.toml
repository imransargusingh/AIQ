[package]
name = "aiq-core"
description = "AIQ core: paths, local API, spool, single-writer decision loop, bundled pack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aiq-contracts.workspace = true
aiq-domain.workspace = true
aiq-store.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
interprocess.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
