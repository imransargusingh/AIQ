# Bundled Phase 1 pack (unsigned, compiled into the binary behind the PackSource seam).
# Every number here is uncalibrated pack data; the real-data week tunes it (design: assume: lines).
schema = "aiq.pack.v1"
pack_id = "aiq.core"
version = "bundled-13"
idle_gap_min = 30

[reprompt]
detector_id = "reprompt"
detector_version = 2
opportunity_id = "reprompt"
core_opportunity = true
similarity = 0.6
max_new_words = 4
threshold = 3
window = 8
min_word_len = 3
# Phase 0 spike stop words (prototypes/phase0-spike/aiq_spike/group.py).
stop_words = [
  "a", "an", "the", "and", "or", "to", "of", "in", "on", "for", "with", "from", "by", "is", "are", "be", "it",
  "this", "that", "these", "those", "i", "we", "you", "my", "our", "me", "us", "do", "does", "did", "can",
  "could", "should", "would", "will", "please", "just", "also", "then", "now", "so", "if", "at", "as", "not",
  "no", "yes", "ok", "okay", "use", "using", "make", "add", "run", "show", "write", "fix", "get", "let", "what",
  "how", "why", "when", "which", "there", "here", "all", "any", "one", "into", "out", "up", "don't", "dont",
  "its", "it's", "been", "was", "were", "has", "have", "had", "them", "they", "he", "she",
]
# VS Code agent mode can start a new Copilot session every turn: treat its sessions as one stream.
span_surfaces = ["vscode"]
cues = [
  "try again", "again", "still not working", "still doesn't work", "still does not work", "still broken",
  "still wrong", "that's wrong", "that is wrong", "that's not it", "not what i asked", "no, i meant",
  "no i meant", "doesn't work", "does not work", "not working",
]

[trigger]
rule_id = "in_moment.v2"
in_moment_threshold = 0.75
ready_expiry_min = 30
default_daily_cap = 5
quiet_min = 30

# Automated sessions (import spec US-12): set aside a folder when a burst or a repeated first prompt shows
# an app or script is driving the tool. Spec values, tested on Imran's history 2026-11-01.
[automated]
burst_sessions = 50
burst_min = 30
template_sessions = 11
template_window_h = 24
template_chars = 200

[[tips]]
tip_id = "reprompt.add-what-changed"
opportunity_id = "reprompt"
noticed = "this request went round {count} times. The agent may need one new detail."
why = "rewording alone rarely changes the result; the agent needs something new to go on."
try_this = "say what was wrong with the last answer, and add one example, file or limit."

# Coaching from rung results (docs/design/coaching-from-rungs.md). Spec values are marked; every other
# number is a first guess until measured on real use (match_threshold: set from `aiq coach check-guess`).
[coach]
window_days = 30          # Home's window (spec Q3)
recurring_min = 3         # D3; same as the habit minimum
type_majority = 0.5       # D3: more than half
match_threshold = 0.45    # guess
match_agree = 2           # guess
match_top = 3             # guess
guess_check_min = 10      # D10
guess_precision = 0.8     # D10; mirrors the 0.8 coaching bar
move_cooldown_h = 72      # D12
split_min = 10            # aiq-home US-H2 (spec)
week_min = 3              # guess
kept_rule = "delegated_no_correction"   # Imran 2026-11-02 (Q-A), until F2 exists
snooze_days = 7           # coaching-loop US-4 (spec)
not_helpful_days = 30     # coaching-loop US-4 (spec)
habit_days = 14           # coaching-loop D5 (spec)
habit_min = 3             # coaching-loop D5 (spec)

# Moves, in pack order (ties between moves go to the earlier one). Text is pack-written: a card never
# carries model text, a rung name or a number (coaching-loop Part C).
[[moves]]
move_id = "brief"
step = 1
facts = ["F4"]
job = "code_change"
# F4 read right only 10 of 15 in the real-data fact check (PR #27, measured): coach its "no" only when sure.
# One `brief` move per job, so the words fit the work (the id stays `brief` for code, so past answers hold).
min_confidence = 0.8
habit = "Paste the error or name the files, and say what not to touch"
noticed = "this looks like {type}. The goal and limits up front help the agent."
why = "the real error text and the files involved tell the agent where to look; a limit stops it changing too much."
try_this = "paste the exact error or failing test, name the files it touches, and say what must not change."
starter = "Goal: <what done looks like>. Error or test: <paste it>. Files: <where to look>. Don't change: <what to leave alone>."
counts = "Counts when your request gives the goal, the context (such as a pasted error or file names) and a limit."

[[moves]]
move_id = "brief_doc"
step = 1
facts = ["F4"]
job = "write_doc"
min_confidence = 0.8
habit = "Name the reader, and give an example doc to copy"
noticed = "this looks like {type}. The reader and purpose up front help the agent."
why = "a named reader and an example of the shape you want need far less rewriting than a description."
try_this = "say who will read it and what they should do after, and point at a past doc whose shape you like."
starter = "Write <doc> for <reader> so they can <decide or do what>. Follow the shape of <example doc>. Use <sources>. Keep it under <length>."
counts = "Counts when your request names the reader, the purpose and the limits, such as length or an example to follow."

[[moves]]
move_id = "brief_question"
step = 1
facts = ["F4"]
job = "ask_research"
min_confidence = 0.8
habit = "Say what you'll do with the answer, and what you already know"
noticed = "this looks like {type}. Why you ask and what to skip help the agent."
why = "the reason behind a question and what you already know let the agent answer the right question."
try_this = "say what you'll do with the answer, what you already know, and where not to look."
starter = "I'm asking because <decision or task>. I already know <what you know>. Look at <where>, not <where not>. Answer: <question>."
counts = "Counts when your question says why you ask, what you already know, and where to look or not look."

[[moves]]
move_id = "new_info"
step = 1
facts = ["F5"]
job = "any"
habit = "Quote what the agent got wrong, then add one new detail"
noticed = "this looks like {type}. Recently, rewording alone took extra rounds."
why = "rewording alone rarely changes the result; the agent needs something new to go on."
try_this = "quote the line that was wrong, say why, and add one example, file or limit."
starter = "This part is wrong: \"<quote>\". Because <why>. Use <example, file or limit> and try again."
counts = "Counts when each follow-up adds something new, not only a rewording."

[[moves]]
move_id = "check_code"
step = 1
facts = ["F6"]
job = "code_change"
habit = "Ask for the test output in the reply"
noticed = "this looks like {type}. Recently, a quick check was skipped."
why = "seeing which tests passed is the quickest check that the change works."
try_this = "end your request with: run the tests and show me what passed and failed. Read it before you use the change."
starter = "<The change>. Then run <test command> and show me the diff and what passed and failed."
counts = "Counts when the result was checked before you used it, such as test output or a diff you read."

[[moves]]
move_id = "check_sources"
step = 1
facts = ["F6"]
job = "write_doc"
habit = "Ask for sources and open questions, then check them"
noticed = "this looks like {type}. Recently, claims weren't checked against a source."
why = "drafted claims can sound right and be wrong; the gaps the agent names are where to look first."
try_this = "ask for each claim's source and a list of what it was unsure of, then answer or fix each one."
starter = "List every factual claim in the draft with its source, then list what you were unsure of and why."
counts = "Counts when you checked the draft before using it, such as answering its open questions or checking sources."

[[moves]]
move_id = "hand_over"
step = 2
facts = ["F13"]
job = "code_change"
habit = "Hand over the whole task and list what done looks like"
noticed = "this looks like {type}. Recently, you handed it over a step at a time."
why = "with the whole task and a short done list, the agent can plan the steps and finish without asking you."
try_this = "describe the whole change, then add Done when with two or three things you can check, such as a test that passes."
starter = "<The whole change>. Done when: <test that passes>, <what you can see>, <what stays untouched>. Make all the edits, then show me the diff."
counts = "Counts when your request hands over the whole outcome and says what finished looks like."

[[moves]]
move_id = "hand_over_doc"
step = 2
facts = ["F13"]
job = "write_doc"
habit = "Ask for the whole draft and list what it must cover"
noticed = "this looks like {type}. Recently, you asked for it a section at a time."
why = "asking for the whole draft with what done means lets the agent keep it consistent."
try_this = "ask for the complete draft, and list the sections or questions a finished one must cover."
starter = "Write the whole <doc>. Done when it covers <sections> for <reader>. Then list what you were unsure of."
counts = "Counts when you ask for the whole draft and say what a finished one must cover."


[[moves]]
move_id = "let_agent_write"
step = 2
facts = ["F1"]
job = "write_doc"
habit = "Have the agent write the doc file from your notes"
noticed = "this looks like {type}. Recently, you wrote most of it yourself."
why = "when the agent reads your notes and writes the file, you review one draft instead of moving text back and forth."
try_this = "give the file path to write in and the notes or folder to read, then review the changes."
starter = "Write <doc> in <file path>. Read <notes or folder> first. When you're done, tell me what you changed and what you were unsure of."
counts = "Counts when the agent edits the file itself."

[[moves]]
move_id = "doc_one_go"
step = 2
facts = ["F12"]
job = "write_doc"
habit = "Send all your changes in one message, then review the draft"
noticed = "this looks like {type}. Recently, you steered it one change at a time."
why = "all your notes in one go let the agent shape the whole draft, and you review it once."
try_this = "collect your changes into one message, then review the next draft as a whole."
starter = "Revise <doc> with all of these: <change>, <change>, <change>. Then show me the full draft and list what you changed."
counts = "Counts when you don't steer the draft one small change per message."

[[moves]]
move_id = "let_agent_edit"
step = 2
facts = ["F1", "F12"]
job = "code_change"
habit = "Use agent mode and let it make the edits"
noticed = "this looks like {type}. Recently, you made most edits yourself."
why = "in agent mode the agent edits the files and runs commands itself, so you review one result instead of steering each step."
try_this = "in Copilot Chat pick Agent in the mode list; agree a short plan, say go, then review the diff once."
starter = "Plan <the change> in a few steps and wait for my go. Then make all the edits yourself and show me the diff."
counts = "Counts when the agent edits the files itself and you don't steer each small step."

# Ask or research (Imran 2026-11-02). Its rungs read F14 (the agent looked it up itself) instead of F1, and
# F15 (sub-agents) instead of F8 and F3.
[[moves]]
move_id = "check_answer"
step = 1
facts = ["F6"]
job = "ask_research"
habit = "Ask for the file, line or link behind each claim in the answer"
noticed = "this looks like {type}. Recently, the answer wasn't checked before use."
why = "an answer can sound sure and still be wrong; open the source and check it says what the answer claims."
try_this = "ask where each claim in the answer comes from, and open one source before you act on it."
starter = "Answer <question>. For each claim, give the file and line, or the link, it comes from, and say how sure you are."
counts = "Counts when you checked the answer before acting on it, such as opening a source or trying it."

[[moves]]
move_id = "whole_question"
step = 2
facts = ["F13"]
job = "ask_research"
habit = "Say what a good answer must cover"
noticed = "this looks like {type}. Recently, you asked it a piece at a time."
why = "the whole question and what a good answer covers lets the agent dig in and report back once."
try_this = "say what you need to decide and what a good answer must cover, then let the agent find it."
starter = "I need to decide <decision>. Find out <question>. A good answer covers <points>, with sources."
counts = "Counts when you ask the whole question and say what a good answer must cover."

[[moves]]
move_id = "let_agent_look"
step = 2
facts = ["F14"]
job = "ask_research"
habit = "Let the agent read the files and logs instead of pasting them in"
noticed = "this looks like {type}. Recently, you pasted the material in yourself."
why = "an agent that reads the files, logs or docs itself often finds what a pasted excerpt leaves out."
try_this = "name where to look and ask the agent to read it itself instead of pasting the material in."
starter = "Read <files, logs or docs> to answer <question>. Don't guess. Tell me what you read and what you found."
counts = "Counts when the agent reads, searches or runs something itself."

[[moves]]
move_id = "ask_one_go"
step = 2
facts = ["F12"]
job = "ask_research"
habit = "Put your follow-ups in the first ask"
noticed = "this looks like {type}. Recently, you steered it one follow-up at a time."
why = "one full ask lets the agent plan its search instead of waiting for your next nudge."
try_this = "put the follow-ups you expect into the first ask, then read the whole answer."
starter = "Find out <question>. Also cover <follow-up> and <follow-up>. Report back once, with sources."
counts = "Counts when you don't steer the agent one follow-up per message."

# Run or ship it (Imran 2026-11-02, design run-or-ship-pack). Its Delegated rung reads F14 (the agent ran it
# itself) instead of F1. The check comes before the hand-over moves, and no move hands over a live system
# without a check or a stop (P7).
[[moves]]
move_id = "brief_run"
step = 1
facts = ["F4"]
job = "run_ship"
min_confidence = 0.8
habit = "Say what should run, where, and what must not break"
noticed = "this looks like {type}. The target and limits up front help the agent."
why = "an agent that knows what should run, where, and what must not break avoids most failed runs."
try_this = "say what should be running or released, in which place, and what must stay untouched."
starter = "Goal: <what should be running or released>. Where: <app, environment, account>. Must not: <what must not break or change>. Then: <the task>."
counts = "Counts when your request says what should run, where, and what must not change."

[[moves]]
move_id = "check_running"
step = 1
facts = ["F6"]
job = "run_ship"
habit = "Ask for proof it works: the page loading or the feature working"
noticed = "this looks like {type}. Recently, the run wasn't checked before moving on."
why = "a command can succeed while the app, release or tool still does not work."
try_this = "say what proves it worked, and ask the agent to show it before you move on."
starter = "After <the step>, show me proof it works: <the page loading, the feature working, or the health check passing>, not only the version number."
counts = "Counts when you checked it worked before moving on."

[[moves]]
move_id = "hand_over_run"
step = 2
facts = ["F13"]
job = "run_ship"
habit = "Hand over the whole run: say what done looks like and where to stop and ask"
noticed = "this looks like {type}. Recently, you handed it over a step at a time."
why = "an agent with the whole run, a done check and a stop point can do the steps and still leave you the risky one."
try_this = "give the whole outcome, how you'll know it's done, and the risky step (deploy, delete, push) where it must stop and ask."
starter = "Do <the whole release or run>. Done means <the check that passes>. Stop and ask before <the risky step>."
counts = "Counts when you hand over the whole run and say what done looks like."

[[moves]]
move_id = "let_agent_run"
step = 2
facts = ["F14"]
job = "run_ship"
habit = "Let the agent run the commands and fix what blocks the goal"
noticed = "this looks like {type}. Recently, you ran the commands yourself."
why = "an agent that runs the commands sees the errors itself and can fix them before it hands back."
try_this = "let the agent run each command and fix what blocks the goal, stop and ask before anything risky, and report what each printed."
starter = "Run the commands yourself to <goal>. Fix errors that block it. Stop and ask before <risky step> or if a fix needs more than that. Tell me each command and what it printed."
counts = "Counts when the agent runs the commands itself."


[[moves]]
move_id = "run_one_go"
step = 2
facts = ["F12"]
job = "run_ship"
habit = "Send the whole run in one message, not one command at a time"
noticed = "this looks like {type}. Recently, you steered it one command at a time."
why = "with the whole run up front, the agent can do the steps and fix errors before it hands back."
try_this = "say the end state and the steps you expect, then let it run and report."
starter = "Get <app or release> to <end state>. Steps I expect: <step>, <step>. Stop and ask before <risky step>. Report each command and what it printed."
counts = "Counts when you don't steer the run one command per message."

[[moves]]
move_id = "written_brief"
step = 3
facts = ["F7"]
job = "any"
habit = "Keep an instructions file in the repo and point to it"
noticed = "this looks like {type}. A written brief would let the agent plan it alone."
why = "an instructions file gives every task the same build, test and done rules, so the agent can plan alone."
try_this = "add .github/copilot-instructions.md or AGENTS.md with how to build, how to test and what done means, and name it in your request."
starter = "Read <instructions file>. Plan the steps, do them, and check each one against it."
counts = "Counts when you give the agent a written brief, spec or instructions file. Naming it in your request makes it clear."

[[moves]]
move_id = "agent_checks"
step = 3
facts = ["F3"]
job = "code_change"
habit = "Put the test command in your instructions file"
noticed = "this looks like {type}. Recently, you ran the checks yourself."
why = "then every task ends with the agent running the tests and fixing what fails, without you asking."
try_this = "add a line such as: before you finish, run <test command>, fix what fails in this change, and never change a test just to make it pass."
starter = "Add to <instructions file>: before you finish, run <test command>. Fix failures in this change only. Never change a test just to make it pass. If something else fails, tell me."
counts = "Counts when the agent runs a test, build or lint command itself."


[[moves]]
move_id = "agent_checks_doc"
step = 3
facts = ["F3"]
job = "write_doc"
habit = "Ask the agent to run a link and spelling check"
noticed = "this looks like {type}. Recently, you checked the doc yourself."
why = "an agent that runs the link and style checks can fix what fails before it hands back."
try_this = "ask the agent to run the doc checks, such as links and spelling, fix what fails, and list any claim it couldn't check."
starter = "<The doc task>. Then run <doc check, such as markdownlint or a link check> and fix what fails. Show me the output."
counts = "Counts when the agent runs a doc check itself, such as markdownlint or a link check."

[[moves]]
move_id = "agent_checks_run"
step = 3
facts = ["F3"]
job = "run_ship"
habit = "Have the agent run a quick \"does it work\" check after each step"
noticed = "this looks like {type}. Recently, you ran the checks yourself."
why = "an agent that runs the smoke test or health check can fix what fails before it hands back."
try_this = "name the script that proves it works, such as a smoke or verify script, and ask the agent to run it after each step."
starter = "<The run or release>. After each step, run <smoke test or health check>. Fix what fails, then show me the output."
counts = "Counts when the agent runs a check itself, such as tests or a script named smoke, verify or check."

[[moves]]
move_id = "split_and_check"
step = 3
facts = ["F8"]
job = "any"
habit = "Give each separate part to a sub-agent, with a check between parts"
noticed = "this looks like {type}. A check between steps would let agents run it alone."
why = "an automated check between steps catches a bad step before the next one builds on it."
try_this = "ask for a short plan, a sub-agent for each separate part, and a test or check the agent runs before the next part starts. Plain words work, such as: use a sub-agent for each part."
starter = "Split <the task> into parts that don't depend on each other. Give each part to a sub-agent, and run <check> after each before going on."
counts = "Counts when sub-agents did the work and the agent ran a check."

[[moves]]
move_id = "split_question"
step = 3
facts = ["F15"]
job = "ask_research"
habit = "Split the question into separate parts, one sub-agent each, then combine"
noticed = "this looks like {type}. Sub-agents could look into each part at once."
why = "each sub-agent reads one source well, and you get one combined answer back."
try_this = "split the question into parts that don't depend on each other, one sub-agent each, then ask for one answer with sources."
starter = "Split <question> by source: <source>, <source>, <source>. Send a sub-agent to each, then combine what they found into one answer with sources."
counts = "Counts when sub-agents looked into the parts of the question."

# Toward a saved workflow (step 4). F9 is not readable yet (rung.rs: unknown in slice 1), so `saved_workflow`
# shows in the rung guide but no tip fires from it until F9 is read; `agent_checks_answer` can fire today.
[[moves]]
move_id = "agent_checks_answer"
step = 4
facts = ["F3"]
job = "ask_research"
habit = "Ask the agent to prove each claim with a query or test"
noticed = "this looks like {type}. Recently, the agent didn't test its answer."
why = "an answer the agent has tested with a command, query or test is far more likely right. Test again when the code or data change."
try_this = "ask the agent to prove each claim with a command, query or test it runs."
starter = "Answer <question>. For each claim, run <command, query or test> that proves it, and show the output."
counts = "Counts when the agent runs a test or check command itself."

[[moves]]
move_id = "saved_workflow"
step = 4
facts = ["F9"]
job = "any"
habit = "Save a task you repeat as a prompt file and run it by name"
noticed = "this looks like {type}. You do this often; a saved workflow could run it."
why = "a saved prompt keeps the steps, inputs and checks the same each time. Still read the result of each run."
try_this = "save the steps as a prompt file in .github/prompts, commit it, then start the next one by its name."
starter = "Turn what we just did into .github/prompts/<name>.prompt.md: its inputs, steps, checks, and when to stop and ask."
counts = "Not counted yet: AIQ can't tell when a saved workflow runs. It's still worth doing."
