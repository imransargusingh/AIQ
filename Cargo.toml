[workspace]
resolver = "3"
members = ["crates/aiq-contracts", "crates/aiq-domain", "crates/aiq-store", "crates/aiq-core", "crates/aiq"]
exclude = ["prototypes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
aiq-contracts = { path = "crates/aiq-contracts" }
aiq-domain = { path = "crates/aiq-domain" }
aiq-store = { path = "crates/aiq-store" }
aiq-core = { path = "crates/aiq-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
interprocess = "2.4"
uuid = { version = "1.29", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
proptest = "1"
tempfile = "3"
jsonschema = { version = "0.33", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
