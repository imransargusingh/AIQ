name: release

# Private-alpha design A1: one Windows zip (aiq.exe, aiq-home.exe, aiq.vsix, install.cmd, install.ps1, upgrade.ps1, README.txt)
# plus SHA256SUMS. aiq.vsix is AIQ's VS Code extension; `aiq install` adds it when VS Code is installed.
# A version tag v* builds it, smoke-tests install.ps1 on the runner, and attaches both files to a DRAFT
# GitHub release: nothing is public until a person presses Publish. workflow_dispatch builds and tests the
# zip as a workflow artifact only, or, with draft_release on, also a draft release v<version> targeting that commit
# (GitHub creates the tag only when the draft is published).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "crates/aiq/src/install.rs"
      - "crates/aiq/src/install_vscode.rs"
      - "extensions/vscode/**"
      - "crates/aiq-core/src/update.rs"
      - "crates/aiq-core/src/autostart.rs"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also make a DRAFT release v<Cargo version> from this commit (the tag is created only when someone presses Publish)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/home/src-tauri
      - name: Version (a tag must match the Cargo version)
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match Cargo version $v"
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build aiq.exe and aiq-statusline.exe
        run: cargo build -p aiq -p aiq-statusline --release --locked
      - name: aiq-statusline.exe - reuse the newest release's file while its version is unchanged (U5n)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Defender's ransomware rule (IT-set) refused a freshly installed aiq.exe started by cmd.exe, which is how
          # Copilot runs its status line (laptop 2026-11-08). The status-line program is therefore the same file in
          # every release until crates/aiq-statusline changes and its version is bumped.
          $built = 'target/release/aiq-statusline.exe'
          $ver = (Select-String -Path crates/aiq-statusline/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = gh release view --repo '${{ github.repository }}' --json tagName -q .tagName 2>$null
          if (-not $tag) { "No published release: using this build of aiq-statusline $ver."; exit 0 }
          $dl = Join-Path $env:RUNNER_TEMP 'prev-release'
          gh release download $tag --repo '${{ github.repository }}' --pattern 'aiq-*-windows-x64.zip' --dir $dl
          if ($LASTEXITCODE -ne 0) { Write-Error "could not download $tag's zip"; exit 1 }
          $un = Join-Path $env:RUNNER_TEMP 'prev-unzipped'
          Expand-Archive (Get-ChildItem $dl -Filter *.zip | Select-Object -First 1).FullName $un
          $prev = Join-Path $un 'aiq-statusline.exe'
          if (-not (Test-Path $prev)) { "$tag has no aiq-statusline.exe: using this build of $ver."; exit 0 }
          $prevVer = ((& $prev --version) -replace '^aiq-statusline\s+', '').Trim()
          if ($prevVer -ne $ver) { "$tag has aiq-statusline $prevVer; this build is $ver: using this build."; exit 0 }
          git fetch --quiet --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          git diff --quiet $tag HEAD -- crates/aiq-statusline
          if ($LASTEXITCODE -ne 0) { Write-Error "crates/aiq-statusline changed since $tag but its version is still $ver. Bump it in crates/aiq-statusline/Cargo.toml."; exit 1 }
          Copy-Item -Force $prev $built
          "Reused $tag's aiq-statusline.exe ($ver), SHA-256 $((Get-FileHash $built).Hash)."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/home/package-lock.json
      - name: Build aiq-home.exe
        working-directory: apps/home
        run: |
          npm ci
          npx tauri build --no-bundle -- --locked
      - name: Build the VS Code extension (aiq.vsix)
        working-directory: extensions/vscode
        run: |
          npm ci
          npm run package
      - name: Zip and checksum
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $stage = Join-Path $env:RUNNER_TEMP "aiq-$v-windows-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/aiq.exe, target/release/aiq-statusline.exe, apps/home/src-tauri/target/release/aiq-home.exe, extensions/vscode/aiq.vsix, packaging/windows/install.cmd, packaging/windows/install.ps1, packaging/windows/upgrade.ps1, packaging/windows/README.txt $stage
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/aiq-$v-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  aiq-$v-windows-x64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS
      - name: Smoke test - install.cmd (double-click path) from the zip on this runner, then uninstall
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $un = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive "dist/aiq-$v-windows-x64.zip" $un
          New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.copilot') | Out-Null
          # install.cmd is what people double-click; it must run install.ps1 even with Mark-of-the-Web on the files.
          Get-ChildItem $un | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          # Reproduce a typical laptop: RemoteSigned for this user, so a downloaded unsigned install.ps1 is refused when run directly (UnauthorizedAccess, as on Imran's laptop).
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          $direct = powershell -NoProfile -Command "& '$(Join-Path $un 'install.ps1')' -NoLaunch -AllowElevated" 2>&1 | Out-String
          if ($direct -notmatch 'UnauthorizedAccess') { Write-Error "expected the direct run to be refused, got: $direct"; exit 1 }
          $env:AIQ_NO_PAUSE = '1'
          cmd /c (Join-Path $un 'install.cmd') -NoLaunch -AllowElevated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $env:USERPROFILE '.aiq\bin'
          foreach ($f in 'aiq.exe', 'aiq-home.exe', 'aiq.vsix') { if (-not (Test-Path (Join-Path $bin $f))) { Write-Error "missing $f"; exit 1 } }
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains $bin)) { Write-Error 'user PATH not set'; exit 1 }
          if (-not (Select-String -Quiet -Path (Join-Path $env:USERPROFILE '.aiq\upgrade-log.txt') -Pattern 'Z Installed AIQ ')) { Write-Error 'install wrote no upgrade-log line'; exit 1 }
          foreach ($f in 'aiq.exe', 'aiq-home.exe', 'aiq-statusline.exe', 'upgrade.ps1', 'aiq.vsix') { if (Get-Item (Join-Path $bin $f) -Stream Zone.Identifier -ErrorAction SilentlyContinue) { Write-Error "$f still marked as downloaded"; exit 1 } }
          # Copilot's status-line program (U5n): installed, says its own version, and for an unknown session prints nothing and exits 0.
          $sl = Join-Path $bin 'aiq-statusline.exe'
          if (-not ((& $sl --version) -match '^aiq-statusline \d')) { Write-Error 'aiq-statusline.exe --version'; exit 1 }
          $out = '{"session_id":"smoke"}' | & $sl
          if ($LASTEXITCODE -ne 0 -or $out) { Write-Error "aiq-statusline.exe for an unknown session: exit $LASTEXITCODE, output '$out'"; exit 1 }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'AIQ.lnk'))) { Write-Error 'no shortcut'; exit 1 }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.copilot\hooks\aiq.json'))) { Write-Error 'Copilot not connected'; exit 1 }
          & (Join-Path $bin 'aiq.exe') version
          # install.ps1 turned background judging on (rung-judge D4): a second connect reads it back from the store.
          $again = & (Join-Path $bin 'aiq.exe') install --yes | Out-String
          if ($again -notmatch 'Analysis is already on') { Write-Error "analysis not turned on at install: $again"; exit 1 }
          & (Join-Path $bin 'aiq.exe') uninstall copilot --yes
          if (Test-Path (Join-Path $env:USERPROFILE '.copilot\hooks\aiq.json')) { Write-Error 'Copilot hook left behind'; exit 1 }
      - name: Smoke test - install.ps1 drops a waiting update of the same version, keeps a newer one
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $aiq = Join-Path $env:USERPROFILE '.aiq'
          $un = Join-Path $env:RUNNER_TEMP 'unzipped'
          $stage = Join-Path $aiq 'update'
          $stateFile = Join-Path $aiq 'update.json'
          function Fail([string]$m) { Write-Error $m; Get-Content (Join-Path $aiq 'upgrade-log.txt') -Tail 5; exit 1 }
          function St { Get-Content -Raw $stateFile | ConvertFrom-Json }
          # The laptop on 2026-11-04: a check staged this version, then the person installed it with install.cmd.
          function Wait-Update([string]$tag) {
            $zip = "aiq-$($tag -replace '^v', '')-windows-x64.zip"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Set-Content (Join-Path $stage $zip) 'staged'
            @{ state = 'waiting'; available = $tag; staged = $zip; blocked = 'AIQ home is open'; installed = '0.0.1'; checked_at = '2026-11-04T00:13:00Z' } | ConvertTo-Json | Set-Content $stateFile
          }
          function Install { powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $un 'install.ps1') -NoLaunch -AllowElevated; if ($LASTEXITCODE -ne 0) { Fail "install.ps1 exit $LASTEXITCODE" } }

          Wait-Update "v$v"
          Install
          $s = St
          if ($s.state -ne 'current' -or $s.available -or $s.staged -or $s.blocked -or $s.installed -ne $v) { Fail "same version still waiting: $($s | ConvertTo-Json -Compress)" }
          if ($s.checked_at -ne '2026-11-04T00:13:00Z') { Fail 'other update.json fields were not kept' }
          if (Test-Path $stage) { Fail 'the staged zip was left in .aiq\update' }
          if (-not (Select-String -Quiet -Path (Join-Path $aiq 'upgrade-log.txt') -Pattern 'AIQ-INSTALL-CLEARED-WAITING')) { Fail 'no log line for the dropped update' }

          Wait-Update 'v99.0.0'
          Install
          $s = St
          if ($s.state -ne 'waiting' -or $s.available -ne 'v99.0.0' -or -not (Test-Path (Join-Path $stage 'aiq-99.0.0-windows-x64.zip'))) { Fail "a newer waiting update was dropped: $($s | ConvertTo-Json -Compress)" }

          # The steps below start from no update state.
          Remove-Item -Recurse -Force $stage, $stateFile
      - name: Smoke test - upgrade refuses a tampered zip, upgrades from a good one, rolls back
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $up = Join-Path $env:USERPROFILE '.aiq\bin\upgrade.ps1'
          if (-not (Test-Path $up)) { Write-Error 'install did not copy upgrade.ps1'; exit 1 }
          # Updates restart the core; its own hourly kicker must not reach the real GitHub during these tests.
          & (Join-Path $env:USERPROFILE '.aiq\bin\aiq.exe') config set update off
          $bad = Join-Path $env:RUNNER_TEMP 'bad'
          New-Item -ItemType Directory -Force $bad | Out-Null
          Copy-Item "dist/aiq-$v-windows-x64.zip", dist/SHA256SUMS $bad
          Add-Content -Path (Join-Path $bad "aiq-$v-windows-x64.zip") -Value 'tampered'
          $exeBefore = (Get-FileHash (Join-Path $env:USERPROFILE '.aiq\bin\aiq.exe')).Hash
          powershell -ExecutionPolicy Bypass -File $up -Zip (Join-Path $bad "aiq-$v-windows-x64.zip") -AllowElevated
          if ($LASTEXITCODE -eq 0) { Write-Error 'tampered zip was accepted'; exit 1 }
          if ((Get-FileHash (Join-Path $env:USERPROFILE '.aiq\bin\aiq.exe')).Hash -ne $exeBefore) { Write-Error 'tampered zip changed aiq.exe'; exit 1 }
          powershell -ExecutionPolicy Bypass -File $up -Zip "dist/aiq-$v-windows-x64.zip" -AllowElevated
          if ($LASTEXITCODE -ne 0) { Write-Error 'upgrade from a good zip failed'; exit 1 }
          powershell -ExecutionPolicy Bypass -File $up -Rollback
          if ($LASTEXITCODE -ne 0) { Write-Error 'rollback failed'; exit 1 }
          & (Join-Path $env:USERPROFILE '.aiq\bin\aiq.exe') version
          Get-Content (Join-Path $env:USERPROFILE '.aiq\upgrade-log.txt')
      - name: Smoke test - auto-update refuses a tampered download, waits while AIQ home is open, a newer release replaces the waiting one, installs when idle, never reinstalls a version rolled back from
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $aiq = Join-Path $env:USERPROFILE '.aiq'
          $up = Join-Path $aiq 'bin\upgrade.ps1'
          $exe = Join-Path $aiq 'bin\aiq.exe'
          function St { Get-Content -Raw (Join-Path $aiq 'update.json') | ConvertFrom-Json }
          function Fail([string]$m) { Write-Error $m; Get-Content (Join-Path $aiq 'upgrade-log.txt') -Tail 10; exit 1 }
          # A folder standing in for GitHub: this build's zip published as a newer tag.
          $feed = Join-Path $env:RUNNER_TEMP 'feed'
          New-Item -ItemType Directory -Force $feed | Out-Null
          Copy-Item "dist/aiq-$v-windows-x64.zip", dist/SHA256SUMS $feed
          @{ tag_name = 'v99.0.0'; zip = "aiq-$v-windows-x64.zip" } | ConvertTo-Json | Set-Content (Join-Path $feed 'latest.json')
          $bad = Join-Path $env:RUNNER_TEMP 'feed-bad'
          Copy-Item -Recurse $feed $bad
          Add-Content -Path (Join-Path $bad "aiq-$v-windows-x64.zip") -Value 'tampered'

          $h0 = (Get-FileHash $exe).Hash
          powershell -ExecutionPolicy Bypass -File $up -Check -Apply -Feed $bad
          if ($LASTEXITCODE -eq 0) { Fail 'tampered download was accepted' }
          if ((St).state -ne 'failed') { Fail "tampered: state $((St).state), want failed" }
          if (Test-Path (Join-Path $aiq 'update')) { Fail 'tampered download left staged' }
          if ((Get-FileHash $exe).Hash -ne $h0) { Fail 'tampered download changed aiq.exe' }

          # AIQ home open: the update downloads and waits.
          $home_ = Start-Process -PassThru -FilePath (Join-Path $aiq 'bin\aiq-home.exe')
          Start-Sleep -Seconds 3
          if ($home_.HasExited) { Fail "AIQ home did not stay open on the runner (exit $($home_.ExitCode))" }
          powershell -ExecutionPolicy Bypass -File $up -Check -Apply -Feed $feed
          if ($LASTEXITCODE -ne 3) { Fail "with AIQ home open, exit $LASTEXITCODE, want 3 (waiting)" }
          $s = St
          if ($s.state -ne 'waiting' -or $s.available -ne 'v99.0.0' -or $s.blocked -ne 'AIQ home is open') { Fail "waiting: $($s | ConvertTo-Json -Compress)" }

          # Checks go on while an update waits (laptop 2026-11-05: 0.1.8 waited from 18:58Z and 0.1.9 at 20:32Z was
          # never seen). Same release again: not downloaded again.
          $staged = Join-Path $aiq "update\aiq-$v-windows-x64.zip"
          $t0 = (Get-Item $staged).LastWriteTimeUtc
          Start-Sleep -Seconds 1
          powershell -ExecutionPolicy Bypass -File $up -Check -Feed $feed
          if ($LASTEXITCODE -ne 0) { Fail "re-check of the waiting release: exit $LASTEXITCODE" }
          if ((Get-Item $staged).LastWriteTimeUtc -ne $t0) { Fail 'the waiting release was downloaded again' }
          if ((St).available -ne 'v99.0.0' -or -not (Select-String -Quiet -Path (Join-Path $aiq 'upgrade-log.txt') -Pattern 'AIQ-UPDATE-STILL-NEWEST')) { Fail "re-check: $((St) | ConvertTo-Json -Compress)" }
          # A newer release replaces the waiting one, so AIQ home's box names the newest and Update installs it.
          $feed2 = Join-Path $env:RUNNER_TEMP 'feed2'
          Copy-Item -Recurse $feed $feed2
          @{ tag_name = 'v99.0.1'; zip = "aiq-$v-windows-x64.zip" } | ConvertTo-Json | Set-Content (Join-Path $feed2 'latest.json')
          powershell -ExecutionPolicy Bypass -File $up -Check -Feed $feed2
          if ($LASTEXITCODE -ne 0) { Fail "newer release while one waits: exit $LASTEXITCODE" }
          $s = St
          if ($s.state -ne 'waiting' -or $s.available -ne 'v99.0.1' -or -not (Test-Path $staged)) { Fail "newer release did not replace the waiting one: $($s | ConvertTo-Json -Compress)" }
          $view = (& $exe update) -join ' '
          if ($view -notmatch '99\.0\.1') { Fail "aiq update does not name 99.0.1: $view" }
          # A newer download that fails its checksum, or a check that fails, keeps the waiting release; with -Apply
          # the run still goes on to install it (here AIQ home is open, so it waits: exit 3).
          $bad2 = Join-Path $env:RUNNER_TEMP 'feed-bad2'
          Copy-Item -Recurse $bad $bad2
          @{ tag_name = 'v99.0.2'; zip = "aiq-$v-windows-x64.zip" } | ConvertTo-Json | Set-Content (Join-Path $bad2 'latest.json')
          powershell -ExecutionPolicy Bypass -File $up -Check -Feed $bad2
          if ($LASTEXITCODE -eq 0) { Fail 'tampered newer download was accepted' }
          $s = St
          if ($s.state -ne 'waiting' -or $s.available -ne 'v99.0.1' -or -not (Test-Path $staged)) { Fail "tampered newer download dropped the waiting one: $($s | ConvertTo-Json -Compress)" }
          powershell -ExecutionPolicy Bypass -File $up -Check -Apply -Feed (Join-Path $env:RUNNER_TEMP 'no-such-feed')
          if ($LASTEXITCODE -ne 3) { Fail "failed check with one waiting: exit $LASTEXITCODE, want 3 (went on to install, AIQ home open)" }
          if ((St).available -ne 'v99.0.1') { Fail "failed check dropped the waiting one: $((St) | ConvertTo-Json -Compress)" }
          Stop-Process -Id $home_.Id -Force
          Start-Sleep -Seconds 1

          # Idle: the waiting update installs, keeps .old copies, and says so. A core is running, as on a laptop.
          # Windows refuses the first two starts (laptop 2026-11-05 23:22:12Z: "Access is denied" right after the swap):
          # the core is started on a later try and AIQ home opens again (-Relaunch).
          Start-Process -WindowStyle Hidden -FilePath $exe -ArgumentList 'core'
          Start-Sleep -Seconds 2
          powershell -ExecutionPolicy Bypass -File $up -Apply -Relaunch -FailLaunches 2
          if ($LASTEXITCODE -ne 0) { Fail "apply when idle: exit $LASTEXITCODE" }
          $ulog = Join-Path $aiq 'upgrade-log.txt'
          Select-String -Path $ulog -Pattern 'AIQ-UPDATE-(CORE|HOME)' | Select-Object -Last 4 | ForEach-Object { $_.Line }
          if (-not (Select-String -Quiet -Path $ulog -Pattern 'AIQ-UPDATE-CORE: started the AIQ core again.*\(refused first')) { Fail 'core not started again after two refusals' }
          if (-not (Select-String -Quiet -Path $ulog -Pattern 'AIQ-UPDATE-HOME: started AIQ home again')) { Fail 'AIQ home not opened again (-Relaunch)' }
          $homeBack = $null
          foreach ($i in 1..25) {
            $homeBack = Get-Process -Name 'aiq-home' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $aiq 'bin\aiq-home.exe') }
            if ($homeBack) { break }
            Start-Sleep -Milliseconds 200
          }
          if (-not $homeBack) { Fail 'no AIQ home running after -Relaunch' }
          $homeBack | Stop-Process -Force
          Start-Sleep -Seconds 1
          $s = St
          if ($s.state -ne 'applied' -or $s.installed_tag -ne 'v99.0.1' -or $s.from -ne $v) { Fail "applied: $($s | ConvertTo-Json -Compress)" }
          if (Test-Path (Join-Path $aiq 'update')) { Fail 'staged files left after install' }
          foreach ($f in 'aiq.exe.old', 'aiq-home.exe.old') { if (-not (Test-Path (Join-Path $aiq "bin\$f"))) { Fail "no $f kept" } }
          # The core is started again after the swap (laptop 2026-11-04: it stayed down until a hook started it).
          $core = $null
          foreach ($i in 1..25) {
            $core = Get-CimInstance Win32_Process -Filter "Name='aiq.exe'" | Where-Object { $_.ExecutablePath -eq $exe -and $_.CommandLine -match '\score\s*$' }
            if ($core) { break }
            Start-Sleep -Milliseconds 200
          }
          if (-not $core) { Fail 'no AIQ core running after the update' }
          & $exe update

          # Go back: the release left is never installed again by itself.
          # Every start refused, and a hook brings the core back meanwhile: the script sees it and does not start a
          # second one; AIQ home can't be opened, which is logged, never an error that ends the script.
          # The "hook" is its own powershell process (not a job), as a real hook is its own process.
          $hookLog = Join-Path $env:RUNNER_TEMP 'hook.txt'
          $hookPs = Join-Path $env:RUNNER_TEMP 'hook.ps1'
          Set-Content -Path $hookPs -Value @'
          param($ulog, $exe, $out, [int]$before)
          foreach ($i in 1..150) {
            if (@(Select-String -Path $ulog -Pattern 'Rolled back to AIQ').Count -gt $before) {
              Start-Process -WindowStyle Hidden -FilePath $exe -ArgumentList 'core'
              Add-Content -Path $out -Value "started the core at $((Get-Date).ToUniversalTime().ToString('o'))"
              return
            }
            Start-Sleep -Milliseconds 200
          }
          Add-Content -Path $out -Value 'never saw the rollback line'
          '@
          # The earlier smoke step rolled back too, so the hook waits for a new "Rolled back" line, not any (main f2b8c3f:
          # it saw the old line, started its core before this rollback stopped AIQ, and the rollback stopped it).
          $before = @(Select-String -Path $ulog -Pattern 'Rolled back to AIQ').Count
          $hook = Start-Process -PassThru -WindowStyle Hidden -FilePath powershell -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $hookPs, $ulog, $exe, $hookLog, $before
          powershell -ExecutionPolicy Bypass -File $up -Rollback -Relaunch -FailLaunches 99
          if ($LASTEXITCODE -ne 0) { Fail 'rollback failed' }
          $hook | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          if (-not (Select-String -Quiet -Path $ulog -Pattern 'AIQ-UPDATE-CORE: the AIQ core was already running again\.')) {
            Get-Content $hookLog -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -Filter "Name='aiq.exe'" | ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" }
            Fail 'core that came back by itself was not seen'
          }
          if (-not (Select-String -Quiet -Path $ulog -Pattern 'AIQ-UPDATE-HOME: could not start AIQ home')) { Fail 'refused AIQ home start not logged' }
          $cores = @(Get-CimInstance Win32_Process -Filter "Name='aiq.exe'" | Where-Object { $_.ExecutablePath -eq $exe -and $_.CommandLine -match '\score\s*$' })
          if ($cores.Count -ne 1) { Fail "want one AIQ core after rollback, found $($cores.Count)" }
          if ((St).skip -ne 'v99.0.1') { Fail "rollback did not record the release left: $((St) | ConvertTo-Json -Compress)" }
          powershell -ExecutionPolicy Bypass -File $up -Check -Apply -Feed $feed2
          if ((St).state -ne 'rolled_back' -or (Test-Path (Join-Path $aiq 'update'))) { Fail "reinstalled after rollback: $((St) | ConvertTo-Json -Compress)" }

          # A waiting release that is not newer (installed another way after the check) is dropped, never swapped in:
          # the .old copies stay, so Go back still works (laptop 2026-11-04 04:17:03Z).
          $stage = Join-Path $aiq 'update'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/aiq-$v-windows-x64.zip", dist/SHA256SUMS $stage
          @{ state = 'waiting'; available = "v$v"; staged = "aiq-$v-windows-x64.zip"; installed = $v } | ConvertTo-Json | Set-Content (Join-Path $aiq 'update.json')
          $old = Join-Path $aiq 'bin\aiq-home.exe.old'
          Add-Content -Path $old -Value 'marker: this .old must survive'
          $oldHash = (Get-FileHash $old).Hash
          powershell -ExecutionPolicy Bypass -File $up -Apply
          if ($LASTEXITCODE -ne 0) { Fail "same-version apply: exit $LASTEXITCODE, want 0" }
          $s = St
          if ($s.state -ne 'current' -or $s.staged -or $s.available) { Fail "same version not dropped: $($s | ConvertTo-Json -Compress)" }
          if (Test-Path $stage) { Fail 'same version left staged' }
          if ((Get-FileHash $old).Hash -ne $oldHash) { Fail 'same-version apply overwrote the .old copies' }
          if (-not (Select-String -Quiet -Path (Join-Path $aiq 'upgrade-log.txt') -Pattern 'AIQ-UPDATE-NOT-NEWER')) { Fail 'no AIQ-UPDATE-NOT-NEWER log line' }
          # A log that can't be written (another process holds it; release build of 0.1.15, 2026-11-07: "Stream was not
          # readable" ended a rollback) never ends the script: the same drop runs to the end with the log held.
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/aiq-$v-windows-x64.zip", dist/SHA256SUMS $stage
          @{ state = 'waiting'; available = "v$v"; staged = "aiq-$v-windows-x64.zip"; installed = $v } | ConvertTo-Json | Set-Content (Join-Path $aiq 'update.json')
          $held = [IO.File]::Open((Join-Path $aiq 'upgrade-log.txt'), 'Open', 'Read', 'Read')
          try { powershell -ExecutionPolicy Bypass -File $up -Apply; $heldExit = $LASTEXITCODE } finally { $held.Dispose() }
          if ($heldExit -ne 0) { Fail "apply with the log held: exit $heldExit, want 0" }
          if ((St).state -ne 'current' -or (Test-Path $stage)) { Fail "apply with the log held did not finish: $((St) | ConvertTo-Json -Compress)" }
          # Explorer refused or absent: after two rounds AIQ home's --start-core starts the core (laptop 2026-11-07
          # 18:21:05Z: it did when upgrade.ps1's own start was refused).
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/aiq-$v-windows-x64.zip", dist/SHA256SUMS $stage
          @{ state = 'waiting'; available = 'v99.0.2'; staged = "aiq-$v-windows-x64.zip"; installed = $v } | ConvertTo-Json | Set-Content (Join-Path $aiq 'update.json')
          Start-Process -WindowStyle Hidden -FilePath $exe -ArgumentList 'core'
          Start-Sleep -Seconds 2
          powershell -ExecutionPolicy Bypass -File $up -Apply -FailLaunches 99 -FailExplorer
          if ($LASTEXITCODE -ne 0) { Fail "apply with direct core starts refused: exit $LASTEXITCODE" }
          if (-not (Select-String -Quiet -Path $ulog -Pattern 'AIQ-UPDATE-CORE: started the AIQ core again through AIQ home')) { Fail 'core not started through AIQ home' }
          $cores = @(Get-CimInstance Win32_Process -Filter "Name='aiq.exe'" | Where-Object { $_.ExecutablePath -eq $exe -and $_.CommandLine -match '\score\s*$' })
          if ($cores.Count -ne 1) { Fail "want one AIQ core after the start through AIQ home, found $($cores.Count)" }
          Get-Content (Join-Path $aiq 'upgrade-log.txt') -Tail 8
      - name: Smoke test - update check finds the tag from the releases/latest redirect, falls back to the API, records a rate-limit reset
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/tests/upgrade-network.ps1 (Join-Path $env:USERPROFILE '.aiq\bin\upgrade.ps1')
      - name: Smoke test - sign-in start; uninstall --all removes hooks, user PATH entry, shortcut and sign-in entry, keeps the data
        shell: pwsh
        run: |
          $bin = Join-Path $env:USERPROFILE '.aiq\bin'
          & (Join-Path $bin 'aiq.exe') install --yes
          # What Windows runs at sign-in: Home's start-only mode starts the core, and the core writes the entry.
          Start-Process -FilePath (Join-Path $bin 'aiq-home.exe') -ArgumentList '--start-core' -Wait
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $deadline = (Get-Date).AddSeconds(20)
          while (-not (Get-ItemProperty -Path $run -Name AIQ -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          $entry = (Get-ItemProperty -Path $run -Name AIQ -ErrorAction SilentlyContinue).AIQ
          if ($entry -ne ('"{0}" --start-core' -f (Join-Path $bin 'aiq-home.exe'))) { Write-Error "sign-in entry missing or wrong: $entry"; exit 1 }
          & (Join-Path $bin 'aiq.exe') uninstall --all --yes
          if ($LASTEXITCODE -ne 0) { Write-Error 'uninstall --all failed'; exit 1 }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains $bin) { Write-Error 'user PATH entry left behind'; exit 1 }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'AIQ.lnk')) { Write-Error 'shortcut left behind'; exit 1 }
          if (Test-Path (Join-Path $env:USERPROFILE '.copilot\hooks\aiq.json')) { Write-Error 'Copilot hook left behind'; exit 1 }
          if (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name AIQ -ErrorAction SilentlyContinue) { Write-Error 'sign-in entry left behind'; exit 1 }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.aiq\upgrade-log.txt'))) { Write-Error 'data folder touched'; exit 1 }
          $again = & (Join-Path $bin 'aiq.exe') uninstall --all --yes
          if (-not ($again -match 'Nothing changed')) { Write-Error "second run changed something: $again"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: aiq-release-windows-x64
          path: dist/
          retention-days: 14

  draft-release:
    if: github.ref_type == 'tag' || inputs.draft_release
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aiq-release-windows-x64
          path: dist
      - name: Check the checksum, then attach both files to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum -c SHA256SUMS && cd ..
          tag="v${{ needs.windows.outputs.version }}"
          rels=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          # Pressing Publish creates the tag, and the tag push runs this workflow again. Measured 2026-11-03: that
          # run made a second DRAFT tagged v0.1.0 beside the published one. So: a draft whose tag already has a
          # published release is a leftover and goes; a published release is never touched; no new draft for it.
          published=$(jq -c '[.[] | select(.draft | not) | .tag_name]' <<<"$rels")
          jq -r '.[] | select(.draft) | "\(.id) \(.tag_name)"' <<<"$rels" | while read -r id t; do
            if jq -e --arg t "$t" 'index($t) != null' <<<"$published" >/dev/null; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; echo "Removed leftover draft $id ($t is already published)"
            fi
          done
          if jq -e --arg t "$tag" 'index($t) != null' <<<"$published" >/dev/null; then
            echo "$tag is already published; no draft made."; exit 0
          fi
          # A rebuild replaces an older DRAFT of the same version; a published release is never touched.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and .tag_name == "v${{ needs.windows.outputs.version }}") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; echo "Replaced older draft $id"; done
          gh release create "v${{ needs.windows.outputs.version }}" dist/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "AIQ ${{ needs.windows.outputs.version }}" \
            --notes "Private alpha build. Unzip, then double-click install.cmd (see README.txt). Check the zip against SHA256SUMS."
