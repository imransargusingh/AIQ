name: rust

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "extensions/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test (unit, store, spool replay property, end to end through the binary)
        run: cargo test --workspace --locked -- --nocapture --test-threads 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VS Code extension (types, unit tests, round trip with the real core)
        working-directory: extensions/vscode
        env:
          AIQ_BIN: ${{ github.workspace }}/target/debug/aiq
        run: |
          npm ci
          npm test
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: aiq-vscode-extension
          path: extensions/vscode/aiq.vsix
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test (release build, so hook timings resemble what ships)
        env:
          AIQ_E2E_BUDGET_MS: "200"
        run: cargo test --workspace --locked --release -- --nocapture --test-threads 4
      - name: Build aiq.exe
        run: cargo build -p aiq --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: aiq-windows-x64
          path: target/release/aiq.exe
          retention-days: 14
