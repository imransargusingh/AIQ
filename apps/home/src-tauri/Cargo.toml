# AIQ home desktop shell (Tauri 2). Its own workspace, so the core's CI and builds never need a webview.
[package]
name = "aiq-home-app"
description = "AIQ home: the private desktop app. Reads the person's local store; changes go through the core."
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[[bin]]
name = "aiq-home"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aiq-home = { path = "../../../crates/aiq-home" }
aiq-core = { path = "../../../crates/aiq-core" }
aiq-domain = { path = "../../../crates/aiq-domain" }

[workspace]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
